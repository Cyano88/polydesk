services:
  - type: web
    name: polydesk
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    disk:
      name: polydesk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3000"
      - key: PUBLIC_APP_URL
        value: https://polydesk.trade
      - key: DATA_PATH
        value: /var/data
      - key: AGENT_ACTIVITY_STORE
        value: /var/data/agent-activity.json
      - key: VITE_AUTH_BRIDGE
        value: hybrid
      - key: VITE_PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VITE_PUBLIC_PAYLINK_ORIGIN
        value: https://hashpaylink.com
      - key: HASH_PAYLINK_BASE_URL
        value: https://app.hashpaylink.com
      - key: HASH_PAYLINK_API_KEY
        sync: false
      - key: HASH_PAYLINK_AGENTIC_TEST_API_KEY
        sync: false
      - key: HASH_PAYLINK_WEBHOOK_SECRET
        sync: false
      - key: HASH_PAYLINK_WEBHOOK_STORE_KEY
        value: polydesk:hashpaylink-webhooks:v1
      - key: HASH_PAYLINK_POLYDESK_SERVICE_TOKEN
        sync: false
      - key: POLYMARKET_ALERT_FROM_EMAIL
        sync: false
      - key: POLYMARKET_ALERT_FROM_NAME
        value: PolyDesk
      - key: RESEND_API_KEY
        sync: false
      - key: POLYMARKET_EMAIL_ALERTS_ENABLED
        value: "true"

      - key: POLYDESK_MARKET_CONTEXT_ENABLED
        value: 'false'
      - key: POLYDESK_MARKET_CONTEXT_TOKEN
        sync: false

      - key: POLYMARKET_CHAIN_ID
        value: "137"
      - key: POLYMARKET_RELAYER_URL
        sync: false
      - key: POLYMARKET_RPC_URL
        sync: false
      - key: PRIVATE_RPC_URL
        sync: false
      - key: PRIVATE_RPC_URL_BASE_SEPOLIA
        sync: false
      - key: PRIVATE_RPC_URL_ARB
        sync: false
      - key: PRIVATE_RPC_URL_ARC
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: POLYMARKET_BUILDER_CODE
        sync: false
      - key: POLYMARKET_BUILDER_API_KEY
        sync: false
      - key: POLYMARKET_BUILDER_SECRET
        sync: false
      - key: POLYMARKET_BUILDER_PASSPHRASE
        sync: false
      - key: POLYMARKET_ORDER_SIGNING_ENABLED
        sync: false
      - key: POLY_STREAM_FIXTURE_MODE
        value: auto
      - key: POLY_STREAM_LIMIT
        value: "64"
      - key: POLY_STREAM_LEAGUE_IDS
        sync: false
      - key: POLY_STREAM_SEASON
        sync: false
      - key: POLY_STREAM_BASE_URL
        sync: false
      - key: POLY_STREAM_API_KEY
        sync: false
      - key: POLY_NEWS_API_KEY
        sync: false
      - key: POLY_NEWS_PROVIDER
        value: gnews
      - key: POLYMARKET_MARKET_LOOKUP
        value: "1"
      - key: POLYMARKET_LOOKUP_LIMIT
        value: "20"
      - key: PULSE_WARM_INTERVAL_MS
        value: "90000"
      - key: POLYMARKET_MATCH_URLS
        sync: false

      - key: ZEROSCOUT_API_URL
        value: https://zeroscout.app
      - key: ZEROSCOUT_INTEGRATION_SECRET
        sync: false

      - key: DEFAULT_AGENT_SLUG
        value: polydesk-agent
      - key: AGENT_ACTIVITY_STORE_KEY
        value: polydesk:agent-activity
      - key: AGENT_PROFILE_STORE
        sync: false
      - key: AGENT_PROFILE_STORE_KEY
        sync: false

      - key: HASH_PAYLINK_LP_SCOUT_PRICE
        value: "$0.01"

      - key: OKX_X402_API_KEY
        sync: false
      - key: OKX_X402_SECRET_KEY
        sync: false
      - key: OKX_X402_PASSPHRASE
        sync: false
      - key: OKX_X402_PAY_TO
        sync: false
      - key: OKX_X402_BASE_URL
        sync: false
      - key: OKX_X402_SYNC_SETTLE
        value: "false"
      - key: OKX_X402_POLYMARKET_LP_SCOUT_PRICE
        value: "0.3"
      - key: OKX_X402_STANDARD_SERVICE_PRICE
        value: "0.1"
      - key: OKX_X402_SMART_TRADER_PRICE
        value: "0.3"
      - key: OKX_PAYMENT_API_KEY
        sync: false
      - key: OKX_PAYMENT_SECRET_KEY
        sync: false
      - key: OKX_PAYMENT_PASSPHRASE
        sync: false
      - key: OKX_PAYMENT_REALM
        value: polydesk.trade
      - key: POLYDESK_OKX_REWARDS_APPROVED
        value: "false"
      - key: POLYDESK_OKX_REWARDS_RECORDING
        value: "false"
      - key: POLYDESK_OKX_REWARDS_CLAIMS_ENABLED
        value: "false"
      - key: POLYDESK_OKX_REWARDS_PAYOUTS_ENABLED
        value: "false"
      - key: POLYDESK_OKX_REWARDS_LEADERBOARD_ENABLED
        value: "false"
      - key: POLYDESK_OKX_REWARDS_STARTS_AT
        sync: false
      - key: POLYDESK_OKX_REWARDS_ENDS_AT
        sync: false
      - key: POLYDESK_OKX_REWARD_EXCLUDED_WALLETS
        sync: false
      - key: POLYDESK_OKX_REWARDS_PAYOUT_ADDRESS
        sync: false
      - key: POLYDESK_OKX_REWARDS_DAILY_PAYOUT_LIMIT_ATOMIC
        value: "5000000"
      - key: POLYDESK_OKX_REWARDS_MIN_CONFIRMATIONS
        value: "3"
      - key: POLYDESK_OKX_REWARDS_OPERATOR_KEY
        sync: false
      - key: POLYDESK_OKX_REWARDS_XLAYER_RPC_URL
        sync: false
      - key: POLYDESK_A2A_OPERATOR_KEY
        sync: false
